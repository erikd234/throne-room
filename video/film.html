<html lang="en">

<style>
:root{--ink:#2A2536;--paper:#FFFCF6;--paper2:#F3ECE0;--muted:#645B75;--gold:#E7B12F;--mint:#34B386;--rose:#E4506A;--sky:#4F8DF5;--brain:#7C5CFF;--brain2:#35E0FF}
html,body{margin:0;background:#000;overflow:hidden}
[hidden]{display:none!important}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#2B2740;font-family:Nunito,system-ui,sans-serif;color:var(--ink);transform-origin:0 0}
canvas{position:absolute;left:0;top:0}
.layer{position:absolute;inset:0;pointer-events:none}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 6px 0 rgba(20,14,30,.55)}
.h{font-family:Fredoka,sans-serif}
.lbl{font:800 14px Nunito,sans-serif;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.av{width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font:700 18px Fredoka,sans-serif;color:#fff;flex-shrink:0;box-sizing:border-box}
.tag{display:inline-block;font:900 12px Nunito,sans-serif;text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:6px;color:#fff}
.chip{display:inline-flex;align-items:center;gap:8px;border:3px solid var(--ink);border-radius:999px;padding:5px 14px;font:800 16px Nunito,sans-serif;background:var(--paper2)}
.btn{display:inline-flex;align-items:center;gap:10px;border:3px solid var(--ink);background:var(--paper);border-radius:12px;padding:12px 20px;font:600 21px Fredoka,sans-serif;color:var(--ink);box-shadow:0 4px 0 var(--ink);position:relative}
.btn.press{top:4px;box-shadow:0 0 0 var(--ink);filter:brightness(.92)}
.gold{background:var(--gold)}.go{background:#9FE3C4}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
/* chaos */
#chaos{background:#0B0B10;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:10px;padding:10px;box-sizing:border-box}
.term{background:#14131B;border:1px solid #2C2A38;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;transform-origin:center}
.term .tb{height:26px;background:#1F1D29;display:flex;align-items:center;gap:6px;padding:0 10px;font:700 12px 'JetBrains Mono',monospace;color:#8C87A0}
.term .tb i{width:10px;height:10px;border-radius:50%;background:#3A3748;display:inline-block}
.term pre{margin:0;padding:8px 10px;font:500 13px/1.45 'JetBrains Mono',monospace;color:#B9B4CC;white-space:pre-wrap;flex:1;overflow:hidden}
.term .warn{color:#FFB35C}.term .err{color:#FF6B81}.term .ok{color:#7FE0A8}.term .ask{color:#0B0B10;background:#FFE08A}
/* captions */
#cap{position:absolute;left:0;right:0;bottom:44px;display:flex;justify-content:center;pointer-events:none}
#cap .c{max-width:1400px;background:rgba(20,16,30,.86);color:#FFFCF6;border-radius:18px;padding:14px 26px;font:800 36px/1.25 Nunito,sans-serif;text-align:center;letter-spacing:-.005em;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#cap .who{display:inline-block;font:700 22px Fredoka,sans-serif;padding:3px 12px;border-radius:9px;margin-right:12px;vertical-align:4px;color:#2A2536}
#cap .hl{color:#FFD35C}
#cap .hb{color:#9FEFFF}
/* big slam */
#slam{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
#slam div{font:700 260px/1 Fredoka,sans-serif;color:#fff;letter-spacing:.02em;text-shadow:0 0 40px #35E0FF,0 0 90px #7C5CFF,0 10px 0 #2A2536}
/* pip */
#pipwrap{position:absolute;right:36px;top:118px;width:672px;height:420px;border:4px solid var(--ink);border-radius:18px;overflow:hidden;background:#2B2740;box-shadow:0 10px 0 rgba(20,14,30,.55)}
#pipwrap .pl{position:absolute;left:12px;top:12px;display:flex;gap:8px;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:4px 12px 4px 4px;font:700 17px Fredoka,sans-serif}
#fade{position:absolute;inset:0;background:#000;pointer-events:none}
</style>
</head>

<script>
(function(){
/* ================= timing ================= */
const C = {}; CUES.forEach(c => C[c.id] = {t:c.t, d:c.dur, e:c.t + c.dur, text:c.text, who:c.who});
const A = id => C[id].t, E = id => C[id].e;
const END = E('close') + 3.4;
window.FILM_END = END;
const clamp = (v, a=0, b=1) => Math.max(a, Math.min(b, v));
const ease = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3)/2;
const eout = x => 1 - Math.pow(1 - x, 3);
const back = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(x - 1, 3) + c1*Math.pow(x - 1, 2); };
const P = (t, a, b) => clamp((t - a)/(b - a));
const lerp = (a, b, k) => a + (b - a)*k;
const within = (t, a, b) => t >= a && t < b;
function keyed(t, keys){
  if (t <= keys[0][0]) return keys[0].slice(1);
  for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]){
    const a = keys[i-1], b = keys[i], k = ease((t - a[0])/((b[0] - a[0]) || 1));
    return a.slice(1).map((v, j) => lerp(v, b[j+1], k));
  }
  return keys[keys.length-1].slice(1);
}
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0)/4294967296; }; }
// walk: [[time, x, y], ...] in tiles; constant speed between keys
function walk(t, pts){
  if (t <= pts[0][0]) return {x:pts[0][1], y:pts[0][2], moving:false, fx:0, fy:1};
  for (let i = 1; i < pts.length; i++) if (t <= pts[i][0]){
    const a = pts[i-1], b = pts[i], k = (t - a[0])/((b[0] - a[0]) || 1);
    const dx = b[1] - a[1], dy = b[2] - a[2], L = Math.hypot(dx, dy) || 1;
    return {x:lerp(a[1], b[1], k), y:lerp(a[2], b[2], k), moving:L > .01, fx:dx/L, fy:dy/L};
  }
  const l = pts[pts.length-1]; return {x:l[1], y:l[2], moving:false, fx:l[3] ?? 0, fy:l[4] ?? 1};
}
// build a walk from waypoints at a speed (tiles/s)
function route(t0, pts, speed=3.2, face){
  const out = [[t0, pts[0][0], pts[0][1]]]; let t = t0;
  for (let i = 1; i < pts.length; i++){ t += Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1])/speed; out.push([t, pts[i][0], pts[i][1]]); }
  if (face) out[out.length-1].push(face[0], face[1]);
  out.end = t; return out;
}

/* ================= world constants ================= */
const TW = 64, TH = 32, N = 20, WALL = 150;
const iso = (x, y, z=0) => ({x:(x - y)*TW/2, y:(x + y)*TH/2 - z});
const COL = {floorA:'#D9B88A', floorB:'#D1AE7F', seam:'#BF9A6A', wallR:'#B6D1D6', wallTop:'#6D8B96', base:'#5E7A85', sky:'#CBE8F7', frame:'#F7F2E8',
  carpet:'#B8383C', carpetEdge:'#E7B12F', deskTop:'#A0704A', deskL:'#7C5334', deskR:'#684429', mon:'#2E3140', on:'#7FD3FF', off:'#454B5E',
  chair:'#3E4458', gold:'#E7B12F', goldD:'#B98714', velvet:'#7B2D5A', velvetD:'#5E2044', pants:'#3A3F55', shoe:'#26222F'};
const ROLE = {eng:'#4F8DF5', des:'#EE77AE', qa:'#34B386', res:'#F29D38', ops:'#9B7BEA', mkt:'#FF7A59', sup:'#2BB5A8', evt:'#B77CFF', fin:'#2EAD6B'};
const DESKS = [[8,3],[11,3],[14,3],[17,3],[11,7],[14,7],[17,7],[14,11],[3,8],[3,11],[3,14],[3,17],[7,11],[7,14],[7,17],[11,14],[11,17]];
const seatOf = (d) => ({x:d[0] + .5, y:d[1] + 1.35});
const monOf = (d) => iso(d[0] + .5, d[1] + .26, 41);
const QS = i => ({x:4.35 + i*.92, y:4.35 + i*.92});
const AUD = {x:5.3, y:3.35};              // audience spot beside the throne
const DOOR = {x:17.25, y:.45};
const VAULT = {x:18.25, y:18.25};

// seated staff: desk, name, role, repo, skin, hair, state, progress
const STAFF = [
  [[8,3],'Ada','eng','parrot','#F2C9A0','#5A3A24','work',.62],
  [[11,3],'Linus','eng','parrot','#E0A77A','#D9A54A','work',.34],
  [[14,3],'Barbara','eng','parrot','#9C6440','#2B2233','work',.55],
  [[17,3],'Ken','qa','parrot','#C98B5E','#3D3D3D','work',.2],
  [[11,7],'Grace','des','parrot','#F6D6B8','#B5452F','work',.76],
  [[14,7],'Tim','eng','podcast','#F2C9A0','#8C5A2B','work',.12],
  [[14,11],'Alan','des','throne','#E0A77A','#2B2233','work',.5],
  [[3,8],'Radia','mkt','marketing','#6E4430','#2B2233','work',.45],
  [[3,17],'Sam','sup','support','#F2C9A0','#3D3D3D','work',.22],
  [[3,14],'Hedy','sup','support','#F6D6B8','#8C5A2B','work',.4],
  [[7,11],'Frances','evt','events','#C98B5E','#E8E0D0','work',.8],
  [[7,14],'Dennis','evt','events','#E0A77A','#5A3A24','work',.3],
];
const PARROT_DESKS = STAFF.filter(s => s[3] === 'parrot').map(s => s[0]);
const CLIMAX_DESKS = [[8,3],[11,3],[14,3],[17,3],[11,7]];
const TEAM_COL = {parrot:'#4F8DF5', marketing:'#FF7A59', support:'#2BB5A8', events:'#B77CFF', podcast:'#4F8DF5', throne:'#EE77AE', finance:'#2EAD6B'};
const ZONES = [
  {name:'Marketing', col:'#FF7A59', rects:[[2.35,7.5,4.95,13.4]], sign:[2.6,7.7]},
  {name:'Support', col:'#2BB5A8', rects:[[2.35,13.6,4.95,19.75]], sign:[2.6,13.8]},
  {name:'Events', col:'#B77CFF', rects:[[6.35,10.5,8.75,16.3]], sign:[6.6,10.7]},
  {name:'Engineering', col:'#4F8DF5', rects:[[7.6,2.3,19.8,9.8],[9.7,9.8,19.8,12.5]], sign:[9.7,2.6]},
];
const FIN = {name:'Finance', col:'#2EAD6B', rects:[[15.5,12.85,19.8,15.25]], sign:[19.7,12.95]};
const FIN_DESKS = [[16,13],[18.2,13]];
const KIOSK = {x:17.15, y:11.45};
const T_AREA = () => A('area'), T_RING = () => A('auto') + 4.4;
function hexA(hex, a){ const n = parseInt(hex.slice(1), 16); return `rgba(${n>>16},${n>>8&255},${n&255},${a})`; }
function drawZone(z, k=1){
  z.rects.forEach(([x0, y0, x1, y1]) => {
    const yy = y0 + (y1 - y0)*k, pts = [iso(x0,y0), iso(x1,y0), iso(x1,yy), iso(x0,yy)];
    poly(pts, hexA(z.col, .2));
    g.setLineDash([9, 6]); poly(pts, null, hexA(z.col, .85), 2.5); g.setLineDash([]);
  });
}
function drawNewArea(t){
  const t0 = T_AREA() + .05, t1 = T_AREA() + 1.05;
  if (t < t0 || t > t1) return;
  const k = eout(P(t, t0, t0 + .3)), [x0, y0, x1, y1] = FIN.rects[0];
  g.globalAlpha = k; poly([iso(x0,y0), iso(x1,y0), iso(x1,y1), iso(x0,y1)], 'rgba(255,255,255,.28)');
  g.setLineDash([10, 7]); poly([iso(x0,y0), iso(x1,y0), iso(x1,y1), iso(x0,y1)], null, '#FFFFFF', 3); g.setLineDash([]);
  const c = iso((x0 + x1)/2, (y0 + y1)/2), press = t > T_AREA() + .85 ? .92 : 1;
  g.save(); g.translate(c.x, c.y); g.scale(press, press);
  g.font = '700 20px Fredoka, sans-serif'; const w = g.measureText('+ New area').width + 36;
  g.fillStyle = '#FFFCF6'; g.strokeStyle = '#2A2536'; g.lineWidth = 3; rr(-w/2, -20, w, 40, 20); g.fill(); g.stroke();
  g.fillStyle = '#2A2536'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('+ New area', 0, 1); g.textBaseline = 'alphabetic';
  g.restore(); g.globalAlpha = 1;
}
function drawSign(z, k=1){
  const [sx, sy] = z.sign, base = iso(sx, sy), top = iso(sx, sy, 64*k);
  g.strokeStyle = '#6B4A34'; g.lineWidth = 4; g.beginPath(); g.moveTo(base.x, base.y); g.lineTo(top.x, top.y); g.stroke();
  const b = iso(sx, sy, 80*k);
  g.save(); g.translate(b.x, b.y); g.scale(k, k);
  g.font = '700 17px Fredoka, sans-serif'; const w = g.measureText(z.name).width + 30;
  g.fillStyle = z.col; g.strokeStyle = '#2A2536'; g.lineWidth = 3; rr(-w/2, -17, w, 34, 9); g.fill(); g.stroke();
  g.fillStyle = '#FFFFFF'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(z.name, 0, 1); g.textBaseline = 'alphabetic';
  g.restore();
}
function drawKiosk(t){
  const k = back(P(t, A('auto') + .1, A('auto') + .6)); if (P(t, A('auto') + .1, A('auto') + .6) <= 0) return;
  const x = KIOSK.x, y = KIOSK.y, ring = within(t, T_RING(), T_RING() + 1.6), sh = ring ? Math.sin(t*50)*2.5 : 0;
  box(x + .15, y + .15, .3, .3, 46*k, 0, '#5B5670', '#4A4560', '#3E3A52');
  const c = iso(x + .3, y + .3, 66*k);
  g.save(); g.translate(c.x + sh, c.y); g.scale(k, k);
  g.fillStyle = '#FFFCF6'; g.strokeStyle = '#2A2536'; g.lineWidth = 3; g.beginPath(); g.arc(0, 0, 19, 0, 7); g.fill(); g.stroke();
  g.strokeStyle = '#2A2536'; g.lineWidth = 3; g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -12); g.moveTo(0, 0); g.lineTo(9, 0); g.stroke();
  g.fillStyle = '#E7B12F'; g.beginPath(); g.arc(-15, -18, 6, 0, 7); g.arc(15, -18, 6, 0, 7); g.fill(); g.stroke();
  if (ring){ g.strokeStyle = '#FFD35C'; g.lineWidth = 3; [[-30, -24, -38, -30], [30, -24, 38, -30], [-30, 0, -40, 0], [30, 0, 40, 0]].forEach(([a, b2, c2, d]) => { g.beginPath(); g.moveTo(a, b2); g.lineTo(c2, d); g.stroke(); }); }
  g.restore();
  label(c.x - 42, c.y - 30, 'Automations', '#FFFFFF', 12, 900);
  // the ticket pops out when it rings, then waits for someone to take it
  const tr = T_RING() + .25, grab = ACT.grab ?? 1e9;
  if (t > tr && t < grab){
    const q = back(P(t, tr, tr + .35)), p = iso(x + .3, y + .3, 66 + 44*eout(P(t, tr, tr + .5)));
    g.save(); g.translate(p.x, p.y + Math.sin(t*4)*3); g.scale(q, q); ticket(0, 0); g.restore();
    if (t < tr + 2.5) bubble(p.x, p.y - 26, 'Monthly close · 1st, 09:00', '#D9FFE9', 13);
  }
}
function ticket(x, y){
  g.fillStyle = '#FFFFFF'; g.strokeStyle = '#2A2536'; g.lineWidth = 2; rr(x - 16, y - 11, 32, 22, 3); g.fill(); g.stroke();
  g.fillStyle = '#2EAD6B'; g.fillRect(x - 16 + 1, y - 10, 30, 6);
  g.fillStyle = '#2A2536'; g.fillRect(x - 10, y + 1, 20, 2.5); g.fillRect(x - 10, y + 6, 13, 2.5);
}

/* ================= GBrain wall graph ================= */
const BR = {u0:1.4, u1:18.6, v0:18, v1:140};
const brainNodes = [];
const TYPE = {person:'#FF8FC8', repo:'#7FB2FF', decision:'#FFD35C', lesson:'#7FF0B0', company:'#FFB070', topic:'#C9B8FF'};
{
  const named = [
    ['Erik','person',4.2,112],['Bill Land','person',6.4,122],['parrot','repo',9.6,96],['paywall','topic',5.2,84],['streaks','topic',12.2,78],
    ['UTC+13','topic',13.8,58],['QM','company',8.4,128],['@/ui/colors','decision',3.4,60],['Temporal','topic',16.4,104],['macbridge','repo',15.6,40],
    ['one-app','repo',11.4,34],['Ada','person',10.6,58],['GBrain','company',12.8,120],['Joan','person',7.6,42],['launch voice: short','lesson',2.8,96],
  ];
  named.forEach(([label, type, u, v]) => brainNodes.push({label, type, u, v, named:true}));
  const r = rng(7), types = Object.keys(TYPE);
  for (let i = 0; i < 64; i++) brainNodes.push({type:types[Math.floor(r()*types.length)], u:lerp(BR.u0 + .6, BR.u1 - .6, r()), v:lerp(BR.v0 + 10, BR.v1 - 8, r()), named:false, ph:r()*6.28});
  brainNodes.forEach((n, i) => { n.i = i; n.ph = n.ph ?? i; });
}
const brainEdges = [];
brainNodes.forEach((a, i) => {
  const near = brainNodes.map((b, j) => ({j, d:(a.u - b.u)**2*900 + (a.v - b.v)**2})).filter(o => o.j !== i).sort((p, q) => p.d - q.d).slice(0, 2);
  near.forEach(o => { if (!brainEdges.some(e => (e[0] === o.j && e[1] === i))) brainEdges.push([i, o.j]); });
});
const nodeIdx = name => brainNodes.findIndex(n => n.label === name);
const nodePos = n => iso(0, n.u, n.v);
// nodes added during the film
const T_WRITE = () => A('write') + .5, T_BILLRULE = () => A('climax') + .15;
const LESSON = {label:'UTC+13 breaks rollover', type:'lesson', u:11.8, v:66, links:['streaks','UTC+13','Ada','parrot'], at:() => T_WRITE() + 1.3};
const RULE = {label:'📌 No parrot merges on Fridays', type:'decision', u:7.4, v:106, links:['Bill Land','parrot','Erik','QM'], at:() => T_BILLRULE() + 1.25};

/* ================= drawing ================= */
const cv = document.getElementById('w'), ctx = cv.getContext('2d');
let g = ctx;
function poly(pts, fill, stroke, lw=1){ g.beginPath(); g.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i].x, pts[i].y); g.closePath(); if (fill){ g.fillStyle = fill; g.fill(); } if (stroke){ g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); } }
function box(x, y, w, d, h, z, top, left, right, stroke){
  poly([iso(x,y+d,z), iso(x+w,y+d,z), iso(x+w,y+d,z+h), iso(x,y+d,z+h)], left, stroke);
  poly([iso(x+w,y,z), iso(x+w,y+d,z), iso(x+w,y+d,z+h), iso(x+w,y,z+h)], right, stroke);
  poly([iso(x,y,z+h), iso(x+w,y,z+h), iso(x+w,y+d,z+h), iso(x,y+d,z+h)], top, stroke);
}
function rr(x, y, w, h, r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
const wq = (side, a, b, z0, z1) => side === 'R' ? [iso(a,0,z0), iso(b,0,z0), iso(b,0,z1), iso(a,0,z1)] : [iso(0,a,z0), iso(0,b,z0), iso(0,b,z1), iso(0,a,z1)];
function shade(hex, amt){ const n = parseInt(hex.slice(1), 16); const f = v => Math.max(0, Math.min(255, Math.round(v + (amt < 0 ? v*amt : (255 - v)*amt)))); return `rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`; }

function drawRoom(t){
  // right wall with windows, whiteboard, door
  poly(wq('R', 0, N, 0, WALL), COL.wallR); poly(wq('R', 0, N, 0, 10), COL.base);
  const win = (a, b) => { poly(wq('R', a, b, 46, 118), COL.frame); poly(wq('R', a+.12, b-.12, 51, 113), COL.sky); const m = (a+b)/2; poly(wq('R', m-.04, m+.04, 51, 113), COL.frame); poly(wq('R', a+.12, b-.12, 81, 84), COL.frame); };
  win(2.5, 4.5); win(6.5, 8.5);
  poly(wq('R', 11, 14.4, 50, 118), '#FFFFFF', '#8A8FA0', 2);

function drawBrainWall(t){

    g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();

    label(p.x + 11, p.y - 9, n.label, '#B8FFD9', 12.5, 900);
  });
  // gap marker around Temporal
  const tg = -99;
  if (within(t, tg, tg + 5.4)){
    const n = brainNodes[nodeIdx('Temporal')], p = nodePos(n), k = P(t, tg, tg + .4);
    g.strokeStyle = `rgba(255,90,120,${.6 + .4*Math.sin(t*9)})`; g.lineWidth = 3; g.setLineDash([7, 6]);
    g.beginPath(); g.ellipse(p.x + 10, p.y + 8, 64*k, 40*k, -.46, 0, 7); g.stroke(); g.setLineDash([]);
  }
  g.restore();

  g.save(); g.translate(hp.x, hp.y); g.transform(1, -.5, 0, 1, 0, 0);
  g.font = '700 22px Fredoka, sans-serif'; g.fillStyle = '#FFFFFF'; g.textAlign = 'center'; g.fillText('GBRAIN', 0, 0);
  g.restore();
}

// ---- beams: recalls from wall to desks ----
function beamList(){
  if (beamList.cache) return beamList.cache;
  const r = rng(42), out = [];
  const working = STAFF.filter(s => s[6] === 'work');
  const topics = ['paywall colors','streak rollover','@/ui/colors','Erik prefers','CI flakes','QM swarm API','feed player','Temporal retries','Bill’s rules'];
  // ambient beams throughout the office, dense during the GBrain spotlight
  let t = A('tour') + .5;
  while (t < E('climax') + 3){
    const dense = t > A('gbrain') - .2 && t < E('write');
    const s = working[Math.floor(r()*working.length)];
    const n = brainNodes[Math.floor(r()*brainNodes.length)];
    out.push({t0:t, dur:1.3, node:n, desk:s[0], label:dense && r() < .45 ? 'recall · ' + topics[Math.floor(r()*topics.length)] : null});
    t += dense ? .28 + r()*.2 : 1.1 + r()*.9;
  }
  // Maya recalls Erik's preference while talking
  out.push({t0:A('maya') + 1.2, dur:2.0, node:brainNodes[nodeIdx('Erik')], to:() => ACT.maya, label:'recall · how Erik likes launch emails', big:true});
  // Bill's rule lights five desks, one after another
  CLIMAX_DESKS.forEach((d, i) => out.push({t0:T_BILLRULE() + 1.9 + i*.38, dur:1.4, node:RULE, desk:d, spread:true, big:true}));
  beamList.cache = out; return out;
}
function brainLit(t){
  const lit = {};
  beamList().forEach(b => { const k = (t - b.t0)/b.dur; if (k >= 0 && k <= 1 && b.node.i !== undefined) lit[b.node.i] = Math.max(lit[b.node.i] || 0, 1 - k); });
  return lit;
}
function drawBeams(t){
  beamList().forEach(b => {
    const k = (t - b.t0)/b.dur; if (k < 0 || k > 1) return;
    const a = iso(0, b.node.u, b.node.v);
    const target = b.to ? b.to() : null;
    const d = target ? iso(target.x, target.y, 44) : monOf(b.desk);
    const cx = (a.x + d.x)/2, cy = Math.min(a.y, d.y) - 90;
    const alpha = Math.sin(Math.PI*k);
    const col = b.spread ? '127,240,176' : '53,224,255';
    g.save(); g.shadowColor = `rgb(${col})`; g.shadowBlur = 22;

    g.beginPath(); g.moveTo(a.x, a.y); g.quadraticCurveTo(cx, cy, d.x, d.y); g.stroke();
    const q = eout(clamp(k*1.25)), x = (1-q)*(1-q)*a.x + 2*(1-q)*q*cx + q*q*d.x, y = (1-q)*(1-q)*a.y + 2*(1-q)*q*cy + q*q*d.y;
    g.fillStyle = '#FFFFFF'; g.beginPath(); g.arc(x, y, b.big ? 8 : 5.5, 0, 7); g.fill();
    g.restore();
    if (b.label && k < .85){
      g.font = '900 13px Nunito, sans-serif'; const tw = g.measureText(b.label).width + 18;
      const lx = cx - tw/2, ly = cy + 20;

      g.strokeStyle = 'rgba(53,224,255,.9)'; g.lineWidth = 1.5; g.stroke();
      g.fillStyle = '#BFF6FF'; g.textAlign = 'left'; g.fillText(b.label, lx + 9, ly + 17); g.globalAlpha = 1;
    }
  });
}

    g.save(); g.shadowColor = color; g.shadowBlur = 22; g.fillStyle = '#FFF6B8'; g.strokeStyle = '#2A2536'; g.lineWidth = 2;

function learnedAt(p, t){
  const hits = beamList().filter(b => b.spread && b.desk && p.desk && b.desk[0] === p.desk[0] && b.desk[1] === p.desk[1]);
  let best = 0;
  hits.forEach(b => { const k = (t - (b.t0 + b.dur*.8))/2.2; if (k > 0 && k < 1) best = Math.max(best, k); });
  return best;
}

      ${cloud ? '<span style="font:800 14px Nunito;color:#0E7490">QM sandboxes · spin up on demand</span>' : ''}</div>`;
  }).join('');
  const s = `<div style="position:absolute;inset:0;background:#2B2740;opacity:${op}">
    <div style="position:absolute;left:60px;top:44px;display:flex;align-items:baseline;gap:18px;color:#FFFCF6"><span class="h" style="font-weight:700;font-size:48px">Campus</span><span style="font:800 22px Nunito;color:#CFC8E6">every repo, every team, one QM org · one GBrain</span></div>
    <div style="position:absolute;left:60px;right:60px;top:130px;display:grid;grid-template-columns:repeat(4,1fr);gap:26px">${cards}</div></div>`;
  if (s !== campusEl._s){ campusEl.innerHTML = s; campusEl._s = s; }
}

/* ---- title ---- */
function renderTitle(t){
  const t0 = A('close') - .1;
  if (t < t0){ if (titleEl._s){ titleEl.innerHTML = ''; titleEl._s = ''; } return; }
  const k = back(P(t, t0 + .1, t0 + .7)), sub = P(t, t0 + 1.2, t0 + 1.6), chips = P(t, t0 + 2.4, t0 + 2.8), cred = P(t, t0 + 4.2, t0 + 4.6);
  const s = `<div style="position:absolute;inset:0;background:radial-gradient(90% 90% at 50% 40%, #3C2F66 0%, #1A1430 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;opacity:${P(t, t0, t0 + .3)}">
    <svg width="${150*k}" height="${130*k}" viewBox="0 0 34 30"><path d="M3 26 L3 8 L10 16 L17 3 L24 16 L31 8 L31 26 Z" fill="#E7B12F" stroke="#2A2536" stroke-width="2" stroke-linejoin="round"/></svg>
    <div class="h" style="font-weight:700;font-size:200px;line-height:.9;color:#FFFCF6;transform:scale(${k});text-shadow:0 10px 0 #2A2536">Throne</div>
    <div style="font:800 40px Nunito;color:#E9E1FF;opacity:${sub}">The front end for QM</div>
    <div style="display:flex;gap:16px;opacity:${chips};transform:translateY(${(1 - chips)*20}px)">
      <span class="chip" style="font-size:22px;background:#EEE8FF">${brainIcon(24)} Memory by GBrain</span>
      <span class="chip" style="font-size:22px">Sessions, swarms, multiplayer by QM</span>
      <span class="chip" style="font-size:22px">Every team, not just code</span></div>
    <div style="font:800 22px Nunito;color:#B7AED0;margin-top:30px;opacity:${cred}">Erik Dahl · Bill Land · YC Own Your Intelligence Hackathon</div></div>`;
  if (s !== titleEl._s){ titleEl.innerHTML = s; titleEl._s = s; }
}

/* ---- captions ---- */
function capText(c){
  let s = esc(c.text).replace(/G Brain/g, 'GBrain');
  s = s.replace(/(GBrain|one brain|same brain)/g, '<span class="hb">$1</span>').replace(/(QM|Throne|proof|multiplayer|studio)/g, '<span class="hl">$1</span>');
  const who = {erik:['Erik', '#E9E1FF'], maya:['Maya', '#FFD1E6'], bill:['Bill', '#BFF6FF']}[c.who];
  return (who ? `<span class="who" style="background:${who[1]}">${who[0]}</span>` : '') + s;
}
function renderCaption(t){
  const c = CUES.find(c => t >= c.t - .05 && t < c.t + c.dur + .3);
  const s = c && c.id !== 'gbrain' ? `<div class="c">${capText(c)}</div>` : '';
  if (s !== capEl._s){ capEl.innerHTML = s; capEl._s = s; }
}

/* ================= master render ================= */
const pipWrap = $('#pipwrap'), pip = $('#pip');
function renderAt(t){
  const cam = camAt(t);
  renderWorld(ctx, cam, t);
  // world fades in during the reveal
  cv.style.opacity = P(t, A('frame') + 1.9, A('frame') + 2.6);
  // dim for GBrain slam
  const slamOn = within(t, A('gbrain') - .1, A('gbrain') + 1.15);
  slam.hidden = !slamOn;
  if (slamOn){ const k = P(t, A('gbrain') - .1, A('gbrain') + .25); slam.firstChild.style.transform = `scale(${lerp(1.6, 1, eout(k))})`; slam.style.opacity = Math.min(k*2, 1 - P(t, A('gbrain') + .8, A('gbrain') + 1.15)); slam.style.background = `rgba(10,6,24,${.55*slam.style.opacity})`; }
  // Bill's screen: picture in picture
  const pipOn = false;
  pipWrap.hidden = !pipOn;
  if (pipOn){
    const k = 1;
    const b = ACT.bill || {x:6, y:4.5}, bp = iso(b.x, b.y, 30);
    renderWorld(pip.getContext('2d'), [bp.x - 40, bp.y + 10, 2.3], t, {pip:true});
    const l = $('#piplabel'); if (!l._s){ l.innerHTML = `${av('B', '#1F9E97', 30)} Bill’s screen · live`; l._s = 1; }
  }
  renderUI(t); renderChaos(t); renderCampus(t); renderTitle(t); renderCaption(t);
  fadeEl.style.opacity = t < .25 ? 1 - P(t, 0, .25) : t > END - 1.2 ? P(t, END - 1.2, END) : 0;
}
window.renderAt = renderAt;
window.fontsReady = document.fonts.ready.then(() => true);

/* ---- preview playback (not used for capture) ---- */
const stage = $('#stage');
const fit = () => { const s = Math.min(innerWidth/1920, innerHeight/1080); stage.style.transform = `scale(${s})`; };
if (!location.search.includes('capture')){
  addEventListener('resize', fit); fit();
  let t0 = null, playing = true, audio = null;
  const params = new URLSearchParams(location.search); let start = +(params.get('t') || 0);
  try { audio = new Audio('out/mix.m4a'); audio.currentTime = start; } catch {}
  const tick = now => { if (t0 === null) t0 = now - start*1000; const t = (now - t0)/1000; if (playing) renderAt(Math.min(t, END)); requestAnimationFrame(tick); };
  addEventListener('keydown', e => { if (e.key === ' ' && audio) { audio.paused ? audio.play().catch(() => {}) : audio.pause(); } });
  document.fonts.ready.then(() => { audio && audio.play().catch(() => {}); requestAnimationFrame(tick); });
} else { renderAt(0); }
})();
</script>
</body>
